name: Update basic class price
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change basic class price 15,000 -> 16,000 and clean up
        run: |
          set -eux
          git config user.name "toncotura-men"
          git config user.email "133511812+toncotura-men@users.noreply.github.com"
          sed -i 's/15,000/16,000/g' index.html school.html
          git rm -q .github/workflows/update-price.yml
          git add -A
          git commit -m "ベーシッククラスの料金を16,000円に変更"
          git push origin HEAD:main

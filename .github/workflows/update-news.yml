name: Update news date
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change school news date to 2026.04.24
        run: |
          set -eux
          git config user.name "toncotura-men"
          git config user.email "133511812+toncotura-men@users.noreply.github.com"
          sed -i 's/<span class="nd">2026.06.11<\/span>/<span class="nd">2026.04.24<\/span>/' index.html
          git rm -q .github/workflows/update-news.yml
          git add -A
          git commit -m "スクール開講ニュースの日付を2026.04.24に変更"
          git push origin HEAD:main

name: Fix price note wrapping
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Break price note before になります
        run: |
          set -eux
          git config user.name "toncotura-men"
          git config user.email "133511812+toncotura-men@users.noreply.github.com"
          python3 - <<'PYEOF'
          import glob
          PAIRS = [
            ('<p class="price-note">2027年1月以降のご入会は月20,000円（税別）になります。</p>',
             '<p class="price-note"><span class="nw">2027年1月以降のご入会は</span><span class="nw">月20,000円（税別）</span><span class="nw">になります。</span></p>'),
            ('<p class="price-note">2027年1月以降のご入会は月25,000円（税別）になります。</p>',
             '<p class="price-note"><span class="nw">2027年1月以降のご入会は</span><span class="nw">月25,000円（税別）</span><span class="nw">になります。</span></p>'),
          ]
          for f in ("index.html", "school.html"):
              s = open(f, encoding="utf-8").read()
              for a, b in PAIRS:
                  s = s.replace(a, b)
              open(f, "w", encoding="utf-8").write(s)

          # 税別・税込などの括弧付き表記が単独で割れないよう全体で保護
          css = open("assets/css/style.css", encoding="utf-8").read()
          css += """

          /* 注記：金額と（税別）を必ず同じ行に、「になります。」の前で折り返す */
          .price-note .nw { white-space: nowrap; }
          .price-note { line-height: 1.9; }
          """.replace("\n          ", "\n")
          open("assets/css/style.css", "w", encoding="utf-8").write(css)

          for f in glob.glob("*.html"):
              s = open(f, encoding="utf-8").read()
              open(f, "w", encoding="utf-8").write(s.replace("style.css?v=48", "style.css?v=49"))
          PYEOF
          git rm -q .github/workflows/fix-price-note.yml
          git add -A
          git commit -m "価格注記を「になります。」の前で折り返すよう修正"
          git push origin HEAD:main

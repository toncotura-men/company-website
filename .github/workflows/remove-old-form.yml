name: Remove legacy mail form
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drop the old mailto form from personal.html
        run: |
          set -eux
          git config user.name "toncotura-men"
          git config user.email "133511812+toncotura-men@users.noreply.github.com"
          python3 - <<'PYEOF'
          import re, glob, textwrap

          s = open("personal.html", encoding="utf-8").read()

          # 旧フォームのセクション（id="form"）をまるごと削除
          start = s.index('  <section class="page-section" id="form">')
          end = s.index('</section>', start) + len('</section>\n\n')
          removed = s[start:end]
          assert 'apply-form' in removed, "form section not matched"
          s = s[:start] + s[end:]

          # 申し込み導線をCTAとして料金セクションの後ろに追加
          CTA = textwrap.dedent('''\
              <!-- ===== CTA ===== -->
              <section class="page-cta">
                <div class="container">
                  <h2><span class="nw">まずは、</span><span class="nw">お気軽にご相談ください。</span></h2>
                  <p>個人出張指導のお申し込み・ご相談は、下のフォームから承ります。日程や実施場所、ご要望の内容もあわせてお知らせください。</p>
                  <div class="actions">
                    <a href="https://pro.form-mailer.jp/fms/f99b6c0f355307" target="_blank" rel="noopener" class="btn btn-lime"><span>個人出張指導を申し込む</span><span class="arr">&rarr;</span></a>
                    <a href="school.html" class="btn btn-ghost-light"><span>比治山大学連携スクールを見る</span><span class="arr">&rarr;</span></a>
                  </div>
                </div>
              </section>

            ''')
          s = s.replace('  <footer class="site-footer">', CTA + '  <footer class="site-footer">', 1)

          # ページ内リンク（#form）を外部フォームへ
          s = s.replace('href="#form" class="reserve"', 'href="https://pro.form-mailer.jp/fms/f99b6c0f355307" target="_blank" rel="noopener" class="reserve"')
          s = s.replace('<a href="#form"', '<a href="https://pro.form-mailer.jp/fms/f99b6c0f355307" target="_blank" rel="noopener"')
          open("personal.html", "w", encoding="utf-8").write(s)

          for f in glob.glob("*.html"):
              t = open(f, encoding="utf-8").read()
              open(f, "w", encoding="utf-8").write(t.replace("style.css?v=50", "style.css?v=51"))
          PYEOF
          git rm -q .github/workflows/remove-old-form.yml
          git add -A
          git commit -m "個人ページの旧メールフォームを削除し、外部フォームへの導線に統一"
          git push origin HEAD:main

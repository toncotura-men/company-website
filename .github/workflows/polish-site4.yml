name: Fit quote on one line at mid widths
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tune rep-quote size for 900-1180px range
        run: |
          set -eux
          git config user.name "toncotura-men"
          git config user.email "133511812+toncotura-men@users.noreply.github.com"
          python3 - <<'PYEOF'
          import glob
          css = open("assets/css/style.css", encoding="utf-8").read()
          css += """

          /* 代表の言葉：2カラムで幅が狭くなる 900-1180px 帯でも1行に収まるサイズ */
          .rep-quote { font-size: clamp(1.15rem, 2.05vw, 1.6rem); }
          """.replace("\n          ", "\n")
          open("assets/css/style.css", "w", encoding="utf-8").write(css)
          for f in glob.glob("*.html"):
              s = open(f, encoding="utf-8").read()
              open(f, "w", encoding="utf-8").write(s.replace("style.css?v=44", "style.css?v=45"))
          PYEOF
          git rm -q .github/workflows/polish-site4.yml
          git add -A
          git commit -m "中間幅でも代表の言葉が1行に収まるよう文字サイズを調整"
          git push origin HEAD:main

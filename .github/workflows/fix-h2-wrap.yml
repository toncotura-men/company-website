name: Fix h2 phrase wrapping
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrap long headings by phrase so they never split mid-word
        run: |
          set -eux
          git config user.name "toncotura-men"
          git config user.email "133511812+toncotura-men@users.noreply.github.com"
          python3 - <<'PYEOF'
          import glob

          PAIRS = {
            "school.html": [
              ('<h2>大学とつくる、3つのアドバンテージ</h2>',
               '<h2><span class="nw">大学とつくる、</span><span class="nw">3つのアドバンテージ</span></h2>'),
              ('<h3>1年設計のカリキュラムを大学と共同開発</h3>',
               '<h3><span class="nw">1年設計のカリキュラムを</span><span class="nw">大学と共同開発</span></h3>'),
              ('<h3>大学施設がホームグラウンド</h3>',
               '<h3><span class="nw">大学施設が</span><span class="nw">ホームグラウンド</span></h3>'),
              ('<h3>学生と共同開発した「勝てる食事」</h3>',
               '<h3><span class="nw">学生と共同開発した</span><span class="nw">「勝てる食事」</span></h3>'),
              ('<h2>金曜日が、いちばん成長する日になる</h2>',
               '<h2><span class="nw">金曜日が、</span><span class="nw">いちばん成長する日になる</span></h2>'),
              ('<h2>スクール会場・運営会社</h2>',
               '<h2><span class="nw">スクール会場・</span><span class="nw">運営会社</span></h2>'),
              ('<h2>まずは金曜日、グラウンドで会おう。</h2>',
               '<h2><span class="nw">まずは金曜日、</span><span class="nw">グラウンドで会おう。</span></h2>'),
            ],
            "index.html": [
              ('<h2>データで、<br />野球が<span class="em">進化する。</span></h2>',
               '<h2><span class="nw">データで、</span><span class="nw">野球が<span class="em">進化する。</span></span></h2>'),
            ],
            "message.html": [
              ('<h2>その「好き」を、本物の力に。</h2>',
               '<h2><span class="nw">その「好き」を、</span><span class="nw">本物の力に。</span></h2>'),
            ],
            "mvv.html": [
              ('<h2>その一歩が、未来を変える。</h2>',
               '<h2><span class="nw">その一歩が、</span><span class="nw">未来を変える。</span></h2>'),
            ],
            "measurement.html": [
              ('<h2>5項目を、1枚のレーダーに。</h2>',
               '<h2><span class="nw">5項目を、</span><span class="nw">1枚のレーダーに。</span></h2>'),
            ],
          }
          for f, pairs in PAIRS.items():
              s = open(f, encoding="utf-8").read()
              for a, b in pairs:
                  s = s.replace(a, b)
              open(f, "w", encoding="utf-8").write(s)

          # 「まずは、無料体験から。」など共通見出し
          for f in glob.glob("*.html"):
              s = open(f, encoding="utf-8").read()
              s = s.replace('<h2>まずは、無料体験から。</h2>',
                            '<h2><span class="nw">まずは、</span><span class="nw">無料体験から。</span></h2>')
              open(f, "w", encoding="utf-8").write(s)

          # 見出し内の .nw は語間で自然に空くよう調整
          css = open("assets/css/style.css", encoding="utf-8").read()
          css += """

          /* 見出しの文節ブロック：折り返さないときは詰めて表示 */
          h1 .nw, h2 .nw, h3 .nw, h4 .nw, .mvv-headline .nw, .page-hero .jp .nw { vertical-align: top; }
          """.replace("\n          ", "\n")
          open("assets/css/style.css", "w", encoding="utf-8").write(css)

          for f in glob.glob("*.html"):
              s = open(f, encoding="utf-8").read()
              open(f, "w", encoding="utf-8").write(s.replace("style.css?v=46", "style.css?v=47"))
          PYEOF
          git rm -q .github/workflows/fix-h2-wrap.yml
          git add -A
          git commit -m "見出しを文節単位で折り返すよう修正（語中改行を解消）"
          git push origin HEAD:main

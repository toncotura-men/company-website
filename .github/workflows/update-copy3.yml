name: Update copy to ex-pro wording
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change to 元プロ野球選手と比治山大学が共同開発
        run: |
          set -eux
          git config user.name "toncotura-men"
          git config user.email "133511812+toncotura-men@users.noreply.github.com"
          sed -i 's/比治山大学の教授と共同開発した/元プロ野球選手と比治山大学が共同開発した/g' *.html
          sed -i 's/比治山大学の教授と共同で、スポーツ力学の理論に基づく年間プログラムを設計。/元プロ野球選手と比治山大学が共同開発した、スポーツ力学の理論に基づく年間プログラム。/g' *.html
          git rm -q .github/workflows/update-copy3.yml
          git add -A
          git commit -m "紹介文を「元プロ野球選手と比治山大学が共同開発」に変更"
          git push origin HEAD:main

name: Fix fee banner wording
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep amount and (税別) together
        run: |
          set -eux
          git config user.name "toncotura-men"
          git config user.email "133511812+toncotura-men@users.noreply.github.com"
          python3 - <<'PYEOF'
          import glob
          OLD = '<span class="fb-main">入会金 <b>¥10,000</b></span><span class="fb-sub">（税別）／ご入会時のみ</span>'
          NEW = '<span class="fb-main">入会金 <b>¥10,000</b><span class="tax">（税別）</span></span><span class="fb-sub">／ご入会時のみ</span>'
          for f in ("index.html", "school.html"):
              s = open(f, encoding="utf-8").read()
              s = s.replace(OLD, NEW)
              open(f, "w", encoding="utf-8").write(s)

          css = open("assets/css/style.css", encoding="utf-8").read()
          css += """

          /* 入会金バナー：金額と（税別）を必ず同じ行に */
          .fee-banner .fb-main { white-space: nowrap; display: inline-flex; align-items: baseline; gap: 6px; }
          .fee-banner .fb-main .tax { font-size: .62em; font-weight: 700; }
          .fee-banner .fb-sub { white-space: nowrap; }
          @media (max-width: 420px) {
            .fee-banner { padding: 14px 18px; gap: 4px 10px; }
            .fee-banner .fb-main { font-size: 1.05rem; }
            .fee-banner .fb-main b { font-size: 1.3em; }
          }
          """.replace("\n          ", "\n")
          open("assets/css/style.css", "w", encoding="utf-8").write(css)

          for f in glob.glob("*.html"):
              s = open(f, encoding="utf-8").read()
              open(f, "w", encoding="utf-8").write(s.replace("style.css?v=47", "style.css?v=48"))
          PYEOF
          git rm -q .github/workflows/fix-fee-banner.yml
          git add -A
          git commit -m "入会金バナーの（税別）を金額の直後に表示するよう修正"
          git push origin HEAD:main

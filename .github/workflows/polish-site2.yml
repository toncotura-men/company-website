name: Polish wrapping details
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix unit wrapping, compare table on phone, word splits
        run: |
          set -eux
          git config user.name "toncotura-men"
          git config user.email "133511812+toncotura-men@users.noreply.github.com"
          python3 - <<'PYEOF'
          import glob

          # ページ見出しの語中改行を防ぐ
          s = open("school.html", encoding="utf-8").read()
          s = s.replace('<div class="jp">比治山大学 連携スクール — 大学と、つくる。未来基準の育成。</div>',
                        '<div class="jp">比治山大学 連携スクール<span class="nw"> — 大学と、つくる。</span><span class="nw">未来基準の育成。</span></div>')
          open("school.html", "w", encoding="utf-8").write(s)

          s = open("message.html", encoding="utf-8").read()
          s = s.replace('<div class="jp">代表の言葉 — 才能は、もっと自由になれる。</div>',
                        '<div class="jp"><span class="nw">代表の言葉</span><span class="nw"> — 才能は、もっと自由になれる。</span></div>')
          open("message.html", "w", encoding="utf-8").write(s)

          css = open("assets/css/style.css", encoding="utf-8").read()
          css += """

          /* ===== wrapping fine-tuning ===== */
          /* 金額の単位が「（税」「別）」で割れないように */
          .price .unit, .price .yen, .price-old .lbl, .entry-fee .ef-unit,
          .fee-banner .fb-main, .fee-banner .fb-sub, .fee-banner .fb-tag { white-space: nowrap; }
          .price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 2px; }
          /* 強調語が行またぎで割れないように */
          .rep-band .q .em, .phil-statement .em, .mvv-headline .em, .about-copy h2 .em,
          .hero-message .accent, .rep-quote .em { display: inline-block; }
          /* 比較表：スマホでも各列に十分な幅を確保（横スクロール） */
          @media (max-width: 720px) {
            .cmp-table { min-width: 720px; font-size: .9rem; }
            .cmp-table tbody th { width: 150px; }
            .cmp-table th, .cmp-table td { padding: 14px 14px; }
            .cmp-wrap { -webkit-overflow-scrolling: touch; }
          }
          """.replace("\n          ", "\n")
          open("assets/css/style.css", "w", encoding="utf-8").write(css)

          for f in glob.glob("*.html"):
              s = open(f, encoding="utf-8").read()
              open(f, "w", encoding="utf-8").write(s.replace("style.css?v=42", "style.css?v=43"))
          PYEOF
          git rm -q .github/workflows/polish-site2.yml
          git add -A
          git commit -m "金額の単位・強調語・比較表の折り返しを端末別に最適化"
          git push origin HEAD:main

name: Add private session pricing
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add private session CTA and pricing section
        run: |
          set -eux
          git config user.name "toncotura-men"
          git config user.email "133511812+toncotura-men@users.noreply.github.com"
          python3 - <<'PYEOF'
          import glob, textwrap
          FORM = "https://pro.form-mailer.jp/fms/f99b6c0f355307"

          # ===== index.html : 個人の方パネル =====
          s = open("index.html", encoding="utf-8").read()
          OLD = '<p>「もっとうまくなりたい」小学生〜高校生まで。個人セッションも出張で承ります。自分の課題をデータで知り、マンツーマンで「打つ・投げる・走る」を集中的に伸ばします。じっくり通うなら比治山大学内のスクールへ。</p>\n        <a href="https://pro.form-mailer.jp/fms/b7ee603c355055" target="_blank" rel="noopener" class="btn btn-ghost-light"><span>無料体験を申し込む</span><span class="arr">→</span></a>'
          NEW = ('<p>「もっとうまくなりたい」小学生〜高校生まで。ご指定の場所へ伺う<strong>個人出張指導</strong>を承ります。'
                 '投球、打撃、走力の測定や基本動作など、ご要望に応じてご指導させていただきます。じっくり通うなら比治山大学内のスクールへ。</p>\n'
                 '        <div class="panel-actions">\n'
                 '          <a href="' + FORM + '" target="_blank" rel="noopener" class="btn btn-lime"><span>個人出張指導を申し込む</span><span class="arr">→</span></a>\n'
                 '          <a href="personal.html#price" class="btn btn-ghost-light"><span>料金を見る</span><span class="arr">→</span></a>\n'
                 '        </div>')
          assert OLD in s
          s = s.replace(OLD, NEW)
          open("index.html", "w", encoding="utf-8").write(s)

          # ===== personal.html =====
          s = open("personal.html", encoding="utf-8").read()
          s = s.replace('<div class="jp">個人の方 — 無料体験・お申し込み</div>',
                        '<div class="jp"><span class="nw">個人の方</span><span class="nw"> — 個人出張指導・無料体験</span></div>')
          s = s.replace('<p class="lead">「もっとうまくなりたい」その気持ちが第一歩。まずは無料体験で、今の実力をデータで測ってみませんか。下記フォームにご記入のうえ送信してください。</p>',
                        '<p class="lead">「もっとうまくなりたい」その気持ちが第一歩。ご指定の場所へ伺う個人出張指導では、投球、打撃、走力の測定や基本動作など、ご要望に応じてご指導させていただきます。</p>')
          s = s.replace('<div class="chips"><span class="chip">無料体験</span><span class="chip">小学生〜高校生</span><span class="chip">見学だけもOK</span></div>',
                        '<div class="chips"><span class="chip">個人出張指導</span><span class="chip">マンツーマン</span><span class="chip">小学生〜高校生</span><span class="chip">無料体験あり</span></div>\n'
                        '      <div class="hero-actions hero-actions-sub">'
                        '<a href="' + FORM + '" target="_blank" rel="noopener" class="btn btn-lime"><span>個人出張指導を申し込む</span><span class="arr">→</span></a>'
                        '<a href="#price" class="btn btn-ghost-light"><span>料金を見る</span><span class="arr">→</span></a></div>')

          PRICE = textwrap.dedent('''\
              <!-- ===== 個人出張指導 料金 ===== -->
              <section class="page-section dark-section" id="price">
                <canvas class="net-canvas" data-color="150,130,255" aria-hidden="true"></canvas>
                <div class="container">
                  <div class="sec-head reveal">
                    <div class="en">PRIVATE SESSION</div>
                    <h2 class="light"><span class="nw">個人出張指導の</span><span class="nw">内容と料金</span></h2>
                    <p class="light-soft">投球、打撃、走力の測定や基本動作など、ご要望に応じてご指導させていただきます。ご指定の場所へ伺い、マンツーマンで課題を数値化しながら改善します。</p>
                  </div>
                  <div class="price-grid">
                    <div class="price-card reveal">
                      <div class="cls-en">SINGLE</div>
                      <h3>1回（単発）</h3>
                      <p class="cls-copy">まずは一度試したい方へ。測定と課題の洗い出しから始めます。</p>
                      <div class="price"><span class="yen">¥</span>30,000<span class="unit">/回（税別）</span></div>
                      <ul class="cls-list">
                        <li>投球・打撃・走力の測定</li>
                        <li>基本動作の指導</li>
                        <li>ご要望に応じた内容にカスタマイズ</li>
                        <li>ご指定の場所へ出張</li>
                      </ul>
                      <a href="__FORM__" target="_blank" rel="noopener" class="btn btn-violet"><span>個人出張指導を申し込む</span><span class="arr">&rarr;</span></a>
                    </div>
                    <div class="price-card advance reveal d1">
                      <span class="ribbon">20,000円 おトク</span>
                      <div class="cls-en">4 SESSIONS</div>
                      <h3>4回セット</h3>
                      <p class="cls-copy">継続して取り組みたい方へ。測定→改善→再測定のサイクルをしっかり回せます。</p>
                      <div class="price-row"><span class="price-old"><span class="p">¥120,000</span><span class="lbl">単発4回分</span></span></div>
                      <div class="price"><span class="yen">¥</span>100,000<span class="unit">/4回（税別）</span></div>
                      <p class="price-note"><span class="nw">単発4回分より</span><span class="nw">20,000円（税別）</span><span class="nw">おトクです。</span></p>
                      <ul class="cls-list">
                        <li>投球・打撃・走力の測定</li>
                        <li>基本動作の指導</li>
                        <li>ご要望に応じた内容にカスタマイズ</li>
                        <li>ご指定の場所へ出張</li>
                      </ul>
                      <a href="__FORM__" target="_blank" rel="noopener" class="btn btn-lime"><span>個人出張指導を申し込む</span><span class="arr">&rarr;</span></a>
                    </div>
                  </div>
                  <p class="tax-note reveal d2">※ 料金はいずれも税別です。実施場所・日程はお申し込み後にご相談ください。</p>
                </div>
              </section>

            ''').replace("__FORM__", FORM)
          s = s.replace('  <section class="page-section" id="form">', PRICE + '  <section class="page-section" id="form">')
          s = s.replace('<title>個人お申し込み・無料体験｜株式会社HAKI pro — 野球スクール</title>',
                        '<title>個人出張指導・無料体験｜株式会社HAKI pro — 野球スクール</title>')
          s = s.replace('<meta name="description" content="個人向け 無料体験・入会のお申し込み。',
                        '<meta name="description" content="個人出張指導は1回30,000円、4回セット100,000円（税別）。投球・打撃・走力の測定や基本動作など、ご要望に応じて指導します。')
          open("personal.html", "w", encoding="utf-8").write(s)

          # ===== CSS =====
          css = open("assets/css/style.css", encoding="utf-8").read()
          css += textwrap.dedent('''

            /* 分割パネル内のボタン群 */
            .panel-actions { display: flex; flex-wrap: wrap; gap: 12px; }
            .panel-actions .btn { flex: 1 1 auto; justify-content: space-between; }
            @media (max-width: 560px) { .panel-actions { flex-direction: column; } }
            .hero-actions-sub { max-width: 34em; margin-top: 26px; }
            .price-card .ribbon { white-space: nowrap; }
            ''')
          open("assets/css/style.css", "w", encoding="utf-8").write(css)

          for f in glob.glob("*.html"):
              s = open(f, encoding="utf-8").read()
              open(f, "w", encoding="utf-8").write(s.replace("style.css?v=49", "style.css?v=50"))
          PYEOF
          git rm -q .github/workflows/add-private-session.yml
          git add -A
          git commit -m "個人出張指導の申込リンクと料金（1回30,000円／4回100,000円）を追加"
          git push origin HEAD:main
